services:
  # Node Exporter - system metrics (CPU, memory, disk, network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: spheroseg-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9100/metrics']
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus metrics collector
  prometheus:
    # Pinned, not ':latest'. CESNET flagged this stack on 2026-08-26 and a
    # floating tag makes "which version is actually running" unanswerable.
    image: prom/prometheus:v3.10.0
    container_name: spheroseg-prometheus
    ports:
      # Loopback ONLY. Prometheus has no authentication and serves
      # /debug/pprof (heap, goroutine, cmdline) to anyone who can reach it.
      # Grafana queries it over the docker network (http://prometheus:9090),
      # so the app never needs a host port. Publishing it as '9090:9090'
      # binds 0.0.0.0 and puts the whole metrics API on the public internet.
      # A published port is DNAT'd in nat/PREROUTING and then traverses
      # FORWARD (where DOCKER-USER hangs) -- it never reaches INPUT, so ufw
      # rules in INPUT do not see it. This bind is the control that works.
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/production-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_monitoring_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # --web.enable-lifecycle is deliberately NOT enabled: it registers
      # POST /-/quit and POST /-/reload, i.e. an unauthenticated remote
      # shutdown of the monitoring stack. Reload config with
      # `docker compose -f docker-compose.monitoring.yml restart prometheus`.
    depends_on:
      node-exporter:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana dashboard and visualization
  grafana:
    # >= 12.4.3+security-02 closes the ten CVEs CESNET reported on
    # 2026-08-26; see
    # https://github.com/grafana/grafana/releases/tag/v12.4.3%2Bsecurity-02
    # 12.4.9 stays inside 12.4.x, so no dashboard/plugin breakage. Note the
    # floor is 12.4.4, not 12.4.3: the +security-02 release is cut ON TOP of
    # plain 12.4.3, so plain 12.4.3 is older than the fix and still exposed.
    image: grafana/grafana:12.4.9
    container_name: spheroseg-grafana
    ports:
      # Loopback ONLY — reachable from the host (and via `ssh -L`), never
      # from the internet. See the prometheus block above for the rationale.
      - '127.0.0.1:3030:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Read from .env (gitignored). The ':?' form makes compose ABORT if the
      # variable is missing, rather than silently starting with an empty
      # password. The previous hardcoded value leaked via the public repo.
      #
      # BEWARE: Grafana applies this ONLY when it first creates the admin
      # account. Editing it and running --force-recreate does NOT change the
      # password of an existing install -- that lives in grafana.db inside the
      # spheroseg_grafana_data volume and survives the recreate. Rotating for
      # real needs `grafana cli admin reset-admin-password` or
      # PUT /api/admin/users/<id>/password. Check 6 in
      # scripts/monitoring-security-check.sh catches the drift if you forget.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD chybi v .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      # Kept on the public hostname even though the port is now loopback-only:
      # root_url opens nothing, it only builds links. Grafana puts it in alert
      # e-mails (SMTP below, 7 provisioned rules), and 127.0.0.1 there would
      # point the recipient at their own machine. Neither URL is clickable from
      # outside any more -- reach the UI with `ssh -L 3030:127.0.0.1:3030`.
      - GF_SERVER_ROOT_URL=http://cvat2.utia.cas.cz:3030
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/api-monitoring.json
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=hermes.utia.cas.cz:25
      - GF_SMTP_USER=
      - GF_SMTP_PASSWORD=
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=grafana@utia.cas.cz
      - GF_SMTP_FROM_NAME=Spheroseg Grafana
      - GF_SMTP_STARTTLS_POLICY=NoStartTLS
    volumes:
      - grafana_monitoring_data:/var/lib/grafana
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/alerting-production:/etc/grafana/provisioning/alerting:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3


  # PostgreSQL exporter - feeds Prometheus 'postgres' job (postgres-exporter:9187)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: spheroseg-postgres-exporter
    environment:
      - DATA_SOURCE_URI=spheroseg-postgres:5432/spheroseg?sslmode=disable
      - DATA_SOURCE_USER=spheroseg
      - DATA_SOURCE_PASS=${POSTGRES_EXPORTER_PASS}
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # Redis exporter - feeds Prometheus 'redis' job (redis-exporter:9121)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: spheroseg-redis-exporter
    environment:
      - REDIS_ADDR=redis://spheroseg-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
networks:
  app-network:
    external: true
    name: spheroseg

volumes:
  prometheus_monitoring_data:
    name: spheroseg_prometheus_data
  grafana_monitoring_data:
    name: spheroseg_grafana_data
