# Maintenance switch, included at the top of each public HTTPS server block.
#
# While /etc/nginx/snippets/maintenance.on exists (docker/nginx/snippets/ on the
# host), every request to the site gets maintenance.html with HTTP 503. The file
# is checked per request (no open_file_cache here), so toggling needs no reload.
#
# ⚠️ ORDER MATTERS. nginx resolves upstream hostnames (backend, maptimize-frontend…)
# when it loads its config. With those containers stopped, a reload is refused and
# a restart or recreate of this proxy FAILS TO START — taking all three sites down
# hard. So, while the Node containers are stopped, never reload or recreate nginx.
#   switch on : touch maintenance.on            → then stop the app containers
#   switch off: start the app containers first  → then rm maintenance.on
# scripts/maintenance.sh on [--stop-node] | off | status does both in this order.
#
# First used 2026-11-09 for the Node.js security release of 2026-11-11.

error_page 503 @maintenance;

location @maintenance {
    root /etc/nginx/snippets;
    # A fixed target: nothing else in snippets/ (frap-key.conf) can be reached.
    rewrite ^ /maintenance.html break;
    default_type text/html;
    add_header Retry-After "3600" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

if (-f /etc/nginx/snippets/maintenance.on) {
    return 503;
}
