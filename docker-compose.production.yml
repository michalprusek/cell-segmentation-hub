services:
  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.optimized.Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_ML_SERVICE_URL=/api/ml
        - VITE_WS_URL=
    container_name: spheroseg-frontend
    ports:
      # Loopback only — the app is served publicly via nginx (443), which
      # reaches this container over the docker network (frontend:80). This
      # host port is debug access and must not be internet-facing.
      - '127.0.0.1:4000:80'
    networks:
      - spheroseg-network
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend.optimized.Dockerfile
    container_name: spheroseg-backend
    env_file: .env.production
    ports:
      # Loopback only — nginx proxies the API over the docker network
      # (backend:3001). Exposing 4001 publicly bypassed TLS + rate limiting.
      - '127.0.0.1:4001:3001'
    networks:
      - spheroseg-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core settings that must be in environment section
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
      - ENABLE_TRACING=false
      # Database password from shell environment
      - DB_PASSWORD=${DB_PASSWORD}
      # Queue processing — default 1 to prevent concurrent multipart request errors
      - QUEUE_MAX_CONCURRENT_BATCHES=${QUEUE_MAX_CONCURRENT_BATCHES:-1}
      - QUEUE_PARALLEL_PROCESSING_ENABLED=true
      - DATABASE_CONNECTION_POOL_SIZE=50
      - WS_PARALLEL_PROCESSING_ENABLED=true
      # Automated Essays worker (batch MT assay). Reached over the docker network.
      - ESSAYS_SERVICE_URL=${ESSAYS_SERVICE_URL:-http://essays:8000}
    volumes:
      - ./backend/uploads/blue:/app/uploads
      - ./backend/data:/app/data
      - ./logs/backend:/app/logs
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: spheroseg-postgres
    networks:
      - spheroseg-network
    environment:
      - POSTGRES_USER=spheroseg
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=spheroseg
    volumes:
      - postgres_blue_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spheroseg -d spheroseg']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spheroseg-redis
    networks:
      - spheroseg-network
    volumes:
      - redis_blue_data:/data
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Service - 2-way parallel processing with 8GB GPU limit
  ml:
    build:
      context: .
      dockerfile: docker/ml.optimized.Dockerfile
    container_name: spheroseg-ml
    runtime: nvidia
    # Put NVIDIA device permissions into the OCI spec. `runtime: nvidia` alone
    # grants them via a hook that runs AFTER the spec is built, so they never
    # land in `linux.resources.devices`. Anything that makes containerd re-apply
    # that spec (`docker update`, `systemctl daemon-reload`, a systemd cgroup
    # rewrite) then resets the allowlist to the hookless version and the running
    # container silently loses the GPU: `open('/dev/nvidiactl')` starts
    # returning EPERM, `torch.cuda.is_available()` flips to False, and inference
    # falls back to CPU. These rules live in the spec, so a re-apply restores
    # them instead of dropping them.
    #
    # Rules rather than `devices:` deliberately. `devices:` re-resolves the host
    # path on every `docker start`, and `/dev/nvidia-uvm` is created lazily by
    # `nvidia-modprobe` on first CUDA use. On the 2026-01-13 boot the toolkit
    # hook itself logged, while docker was restoring containers, "Could not
    # locate /dev/nvidia-uvm: pattern /dev/nvidia-uvm not found" — the node
    # appeared ~0.6 s later. A hook can warn and continue; an explicit
    # `devices:` entry cannot, so with `restart: always` that same moment is a
    # hard "error gathering device information" instead of a degradation.
    # Cgroup rules stat nothing, so they are safe before the nodes appear.
    #
    # (Do not trust wall-clock timestamps from that boot: the realtime clock
    # jumped +2 h at monotonic 4.65 s, which makes the device-node ctimes look
    # ~1 h 43 min later than dockerd. Use `journalctl -o short-monotonic`.)
    #
    # `runtime: nvidia` above (and the `deploy.resources.reservations.devices`
    # block further down — either one triggers the hook) is still load-bearing:
    # the hook is what creates the nodes inside the container and mounts the
    # driver userspace. These rules only grant ACCESS to a major:minor — they
    # cannot make a device appear. Unlike a hardcoded `/dev/nvidia0`, `c 195:*` also
    # covers a second GPU if one is ever added. Major 239 (nvidia-caps, MIG) is
    # deliberately excluded — not used on an A5000.
    #
    # 195 is NVIDIA's statically assigned major (nvidia0 / nvidiactl /
    # nvidia-modeset). 236 is nvidia-uvm, which takes a DYNAMIC major — verify
    # with `grep nvidia-uvm /proc/devices` after a driver upgrade. If it ever
    # moves, the symptom is the original bug (silent CPU), not an outage.
    device_cgroup_rules:
      - 'c 195:* rmw'
      - 'c 236:* rmw'
    # 1 worker to free GPU memory for Maptimize
    command:
      [
        'uvicorn',
        'api.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--workers',
        '1',
        '--limit-concurrency',
        '100',
        '--timeout-keep-alive',
        '30',
      ]
    ports:
      # Loopback only. The ML FastAPI service has NO auth layer; the backend
      # and nginx reach it over the docker network (ml:8000). A public 4008
      # let anyone drive the shared GPU unauthenticated — critical exposure.
      - '127.0.0.1:4008:8000'
    networks:
      - spheroseg-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://spheroseg:${DB_PASSWORD}@postgres:5432/spheroseg
      - REDIS_URL=redis://redis:6379
      # Sequential processing - single worker for 8GB GPU limit safety
      - ML_INFERENCE_WORKERS=${ML_INFERENCE_WORKERS:-1}
      - ML_ENABLE_PARALLEL_INFERENCE=${ML_ENABLE_PARALLEL_INFERENCE:-false}
      - ML_MAX_CONCURRENT_USERS=${ML_MAX_CONCURRENT_USERS:-1}
      # Sized for the heaviest interactive model. This was microtubule v7
      # (DINOv3-L + DPT), which held ~7-8 GB for a single 1024x1024 forward
      # pass and tripped CUDA OOM under the previous 8 GB cap.
      #
      # Microtubule v5H replaced it and peaks at 0.73 GiB, flat across
      # 1024x1024 and 2048x2048 (it tiles at 512x512 instead of running a ViT
      # over the whole frame). The cap is therefore now sized by the OTHER
      # models, and has NOT been re-measured for them -- lowering it would
      # hand VRAM back to the essays worker on this shared A5000, but only
      # after measuring hrnet / cbam / sperm peaks.
      - ML_MEMORY_LIMIT_GB=${ML_MEMORY_LIMIT_GB:-14}
      - ML_ENABLE_CUDA_STREAMS=true
      - GPU_MEMORY_WARNING_THRESHOLD=90
      - GPU_MEMORY_CRITICAL_THRESHOLD=95
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # High priority GPU settings for SpheroSeg
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,garbage_collection_threshold:0.6
      - CUDA_LAUNCH_BLOCKING=0
      - ML_GPU_PRIORITY=high
      # HuggingFace token, read from .env.production at compose time so it is
      # not baked into the image.
      #
      # NO LONGER for microtubule: v5H's checkpoint is a complete state_dict
      # with no frozen backbone, so MT segmentation needs neither a token nor
      # network access. Kept because SegFormer and the sperm model still call
      # from_pretrained() -- neither repo is gated today, so the token is
      # belt-and-braces, but the cache mount below is load-bearing for them.
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./backend/segmentation/weights:/app/weights:ro
      - ./backend/segmentation/sperm_final/best_model.pth:/app/sperm_final/best_model.pth:ro
      - ./backend/uploads/blue:/app/uploads
      # Persist the HuggingFace cache across container restarts. It held the
      # 1.1 GB DINOv3 backbone for microtubule v7; that model is gone, but
      # SegFormer and sperm still resolve configs/weights through this cache,
      # so removing it would put a network fetch on their first load.
      - ./backend/segmentation/.hf-cache:/home/app/.cache/huggingface
    restart: always
    deploy:
      resources:
        limits:
          memory: 12G # Increased for sperm model (2.1GB model + ConvNeXt backbone)
          cpus: '4.0' # Explicit CPU allocation
        reservations:
          memory: 6G # Increased for sperm model
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests; requests.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Automated Essays worker — batch microtubule assay of ND2 wells via the
  # vendored module at backend/essays/module. Shares the GPU with `ml` but is
  # guarded (start-gate on free VRAM + per-process memory cap) so a batch never
  # OOMs interactive segmentation. Loopback-only + NO auth layer — only the
  # backend reaches it over the docker network (essays:8000). Build with
  # `make build-essays`, which checks the ml base image exists first.
  essays:
    build:
      context: .
      dockerfile: docker/essays.Dockerfile
      args:
        ML_IMAGE: cell-segmentation-hub-ml:latest
    image: cell-segmentation-hub-essays:latest
    container_name: spheroseg-essays
    runtime: nvidia
    # Same reason and same trade-off as the ml service above — see the comment
    # there for why these are cgroup rules and not `devices:`. This container is
    # the one that regressed in the wild: a 180-well job took 36 h on CPU on
    # 2026-07-27 where the same-sized job had taken 1 h 20 m on GPU on 07-08.
    device_cgroup_rules:
      - 'c 195:* rmw'
      - 'c 236:* rmw'
    # Run as the backend's uid:gid (nodejs 1001) so the worker can write into the
    # job dirs the backend creates on the shared uploads volume (status.json +
    # output/). HOME=/tmp keeps any home-dir writes (matplotlib/torch cache) off
    # the image's 1000-owned home when running under a different uid.
    user: '1001:1001'
    command: ['uvicorn', 'essays_api:app', '--host', '0.0.0.0', '--port', '8000', '--workers', '1']
    ports:
      # Loopback only — no auth on the worker; the backend calls it over the
      # docker network (essays:8000). A public port would let anyone drive the
      # shared GPU unauthenticated.
      - '127.0.0.1:4009:8000'
    networks:
      - spheroseg-network
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - MPLCONFIGDIR=/tmp/mpl
      # GPU guard, measured on the 24 GB A5000 against a real well recording.
      #
      # RE-MEASURED 2026-08-17 for microtubule v5H (3 positions of a 2048x2048
      # IRM well, 162 microtubules): the working set is **1.41 GiB reserved**
      # (1.05 GiB allocated), and FLAT — identical at caps of 17.99, 4.80, 2.88
      # and 1.92 GiB, so the process does not grow to fill what it is given.
      # Runtime was flat too (43.0 / 43.6 / 44.0 / 43.9 s) and `results.csv` came
      # out BYTE-IDENTICAL at all four caps, because 1.41 GiB sits far below
      # every one of them and cuDNN's workspace is never constrained.
      #
      # 0.12 (2.88 GiB) is TWICE the measured working set. The cardinal rule is
      # that the cap must sit ABOVE the working set: the old 0.6 (14.13 GiB) sat
      # below v7's 16.36 GiB, so every position hit the ceiling, released
      # ~3.7 GiB of cached blocks back to the driver and had to win them back.
      # On a card shared with the ml service and Maptimize that re-acquisition
      # is a race, and losing it is an OutOfMemoryError — which is how one
      # folder lost 255 wells in one run and 68 in the next (see
      # backend/essays/module/tests/test_failure_resilience.py).
      #
      # The previous 0.75 / 17 GB pair was sized for v7 and reserved ~17.7 GiB
      # for a model that needs under 1.5. Do not raise these again without
      # re-measuring: 17 GB of start-gate meant the batch waited for memory it
      # was never going to use, on a card three tenants share.
      #
      # The start gate tracks the cap: it only has to cover the cap plus the
      # CUDA context (~0.4 GiB), not the whole card.
      - ESSAYS_GPU_MIN_FREE_GB=${ESSAYS_GPU_MIN_FREE_GB:-4}
      - ESSAYS_GPU_MEM_FRACTION=${ESSAYS_GPU_MEM_FRACTION:-0.12}
      - ESSAYS_GPU_WAIT_TIMEOUT_S=${ESSAYS_GPU_WAIT_TIMEOUT_S:-1800}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Reuse the byte-identical microtubule_v5h.pth already on disk (no download).
      - ./backend/segmentation/weights:/app/mt_weights:ro
      # Same host uploads dir the backend writes to — the FS handoff for job I/O.
      - ./backend/uploads/blue:/app/uploads
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests; requests.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: spheroseg-nginx
    volumes:
      - ./docker/nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/nginx.production.conf:/etc/nginx/conf.d/nginx.active.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend/uploads:/app/uploads:ro
      # SSL certificates for production
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Persistent logs for IT audit trail
      - ./logs/nginx:/var/log/nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
      - ml
    networks:
      - spheroseg-network
      - maptimize-network
    restart: always
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  spheroseg-network:
    driver: bridge
    name: spheroseg
  maptimize-network:
    external: true
    name: maptimize-network

volumes:
  postgres_blue_data:
    name: spheroseg_postgres_blue
  redis_blue_data:
    name: spheroseg_redis_blue
