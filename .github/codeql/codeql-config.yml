name: 'SpheroSeg CodeQL config'

# Skip test files and infrastructure scripts.
#
# Test files mock route handlers (Express routers, Multer middleware,
# rate limiters, etc.) and CodeQL flags every mocked handler with
# `js/missing-rate-limiting`, `js/insecure-randomness`, and similar
# warnings — none of which apply because the code never runs against a
# real network. Excluding these files removes the noise so genuine
# production findings stay visible.
paths-ignore:
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - 'tests/**'
  - 'backend/src/test/**'

  # The Python halves of the same exclusion. The globs above are all
  # TypeScript-shaped (`*.test.ts`, `__tests__/`), so the pytest suites were
  # never covered by them and their fixtures alone account for the large
  # majority of open `note` findings — unused imports kept for `importorskip`
  # probes, deliberately-empty excepts around optional dependencies, lambdas
  # passed to `monkeypatch.setattr`. Same rationale as above: none of it is
  # actionable, and it buries real findings in production code.
  - '**/tests/**'
  - '**/test_*.py'
  - '**/conftest.py'
  - 'scripts/**'
  - 'playwright.config.ts'
  - 'vitest.config.ts'
  - 'vitest.setup.ts'
  - 'jest.integration.config.js'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/node_modules/**'

  # Vendored third-party sources. These are copied verbatim so they can be
  # re-synced from upstream without carrying a patch, which means their
  # findings are neither actionable here nor fixable without breaking that
  # property. `security-and-quality` flags 23 of them in nnU-Net's network
  # library alone — redundant assignments, unreachable branches and unused
  # imports, mostly in architectures this project never instantiates — which
  # is enough noise to bury a genuine finding in our own code.
  - '**/vendor/**'

queries:
  - uses: security-and-quality
