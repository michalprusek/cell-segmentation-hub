# Dependency update automation.
#
# WHY THIS FILE EXISTS
# --------------------
# Before 2026-08-27 the repo carried patched transitive versions by hand, via
# `overrides` blocks in the two package.json files. The mechanism worked, but
# the pins were refreshed manually: `"tar": "^7.5.13"` had floated nowhere and
# package-lock.json still held 7.5.16 while 7.5.21 was the patched release, so
# a critical advisory sat open. 82 Dependabot alerts had accumulated the same
# way. Opening the PRs automatically is what keeps that from recurring.
#
# Grouping is deliberate: one PR per ecosystem per week for the patch/minor
# stream, so routine bumps arrive as a single reviewable change rather than as
# a dozen. Every npm and pip ecosystem below carries such a group.
#
# Majors are deliberately left OUT of those groups so each arrives as its own
# PR and gets its own verification — with one exception. The github-actions
# group has no `update-types` filter, so it batches majors too. That is not an
# oversight: `update-types` restricting a group to minor/patch has been
# reported to SUPPRESS the matching majors rather than open them individually
# (dependabot-core#14202), and a silently-withheld `actions/checkout` major is
# worse than a slightly larger Actions PR. Workflow pins are also the cheapest
# thing here to review and revert.
version: 2

updates:
  # ---------------------------------------------------------------- frontend
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Majors are never routine here. This repo's dependency story is a set of
      # deliberate, verified pins -- tailwindcss 3->4 restyles every surface,
      # zod 3->4 changes the validation API the whole backend is written
      # against, opencv 4->5 sits under the ML stack. Adding this file opened 16
      # such PRs in one go, none of them mergeable without a project behind it.
      #
      # Suppressing the PR does NOT suppress the alert: if a major ever carries
      # a security fix, it still shows up in the Dependabot alert list, where a
      # human decides. What this removes is the weekly reminder that a major
      # exists, which is not news.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # ----------------------------------------------------------------- backend
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Majors are never routine here. This repo's dependency story is a set of
      # deliberate, verified pins -- tailwindcss 3->4 restyles every surface,
      # zod 3->4 changes the validation API the whole backend is written
      # against, opencv 4->5 sits under the ML stack. Adding this file opened 16
      # such PRs in one go, none of them mergeable without a project behind it.
      #
      # Suppressing the PR does NOT suppress the alert: if a major ever carries
      # a security fix, it still shows up in the Dependabot alert list, where a
      # human decides. What this removes is the weekly reminder that a major
      # exists, which is not news.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # -------------------------------------------------------------- ML service
  - package-ecosystem: pip
    directory: /backend/segmentation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ml-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # LOAD-BEARING PINS — see CLAUDE.md "Deploy Gotchas" and failure
      # pattern #16. These are held on purpose, so an automated PR for them is
      # noise that can never be merged as-is:
      #
      #  torch / torchvision  mamba-ssm and causal-conv1d ship CUDA kernels
      #                       source-built against torch 2.6.0+cu124. Moving
      #                       torch means recompiling both kernels, re-pairing
      #                       torchvision, and re-verifying all 7 models.
      #  transformers         pinned at 5.5.4, and only MINOR/MAJOR are
      #                       ignored -- patches still flow. 5.9.0 renames the
      #                       SegFormer module layout so our checkpoint stops
      #                       loading (bisected 2026-09-04: 5.6.2 / 5.7.0 /
      #                       5.8.1 clean and bit-identical, 5.9.0 and every
      #                       release above it broken), and 5.10.x will not
      #                       even import a model on torch 2.6.0. That is why
      #                       GHSA-xrqw-3rrv-vx5w, whose fix lands in 5.10.0,
      #                       cannot be taken -- see the CEILING note in
      #                       backend/segmentation/requirements.txt. Do not
      #                       close that alert by moving the pin.
      #
      #                       READ THIS BEFORE MERGING A TRANSFORMERS PR, patch
      #                       included: CI cannot verify this dependency. The
      #                       only real check loads the SegFormer and sperm
      #                       DINOv2 checkpoints and hashes a fixed-input
      #                       forward, and it needs weights that are not in the
      #                       repo. A green build here proves nothing about the
      #                       models -- run the probe by hand.
      #
      #                       Patch PRs are allowed to OPEN anyway because they
      #                       cannot merge themselves: allow_auto_merge is off
      #                       and the main-protection ruleset requires review.
      #                       So the PR is a notification carrying a diff, not
      #                       an applied change, and suppressing it would cost
      #                       visibility without buying safety.
      #  opencv-python-headless
      #                       4.11.0.86 is the last release installable here.
      #                       Measured 2026-09-04: 4.14.0.94 gives
      #                       ResolutionImpossible against the numpy 1.26.4
      #                       pin, and the real wall is 4.12 -- 4.12.0.88
      #                       already requires numpy>=2,<2.3 ("Packages for
      #                       Python 3.9+ are built with Numpy 2.x"). That is a
      #                       WHEEL BUILD property, so there is no intermediate
      #                       release to land on: it is blocked until numpy
      #                       moves, which is blocked until torch moves. Unlike
      #                       transformers, a PR here is not a useful
      #                       notification -- it cannot even be installed to be
      #                       evaluated -- so it is ignored outright rather
      #                       than left to open. See #402 / #466.
      #  numpy                1.26.4 is what the pinned torch was built against.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
      - dependency-name: opencv-python-headless
      - dependency-name: transformers
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # ------------------------------------------------------------ essays worker
  # Built FROM the ml image, so it inherits that validated stack and carries
  # the same pins for the same reasons.
  - package-ecosystem: pip
    directory: /backend/essays/module
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      essays-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
      - dependency-name: opencv-python-headless
      - dependency-name: transformers
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # --------------------------------------------------------- GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
