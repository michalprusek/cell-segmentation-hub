name: CI

# Merge gate for pull requests into main (and a post-merge check on main).
# Runs the type/lint/i18n checks PLUS the green Vitest suites with coverage
# enforcement, so a PR that breaks tests or drops coverage below the configured
# floor (frontend vitest.config.ts: 80%; backend/vitest.config.ts: 75%) fails
# the check.
#
# The frontend "TypeScript" step runs `npm run type-check`, which is
# scripts/type-check-baseline.mjs: it type-checks tsconfig.app.json,
# tsconfig.node.json and tsconfig.test.json for real and fails on any error not
# already recorded in the committed typecheck-baseline.json.
#
# It used to be a bare `tsc --noEmit` on the root tsconfig (`files: []` +
# project references). `tsc -p` does not follow references, so that step
# resolved 0 input files and passed unconditionally — it checked nothing. The
# baseline exists because the real configs currently report ~1.9k pre-existing
# errors; the gate blocks NEW ones without demanding they all be fixed first.
# Regenerate the baseline with `npm run type-check:update` (reviewable: the
# accepted errors show up as added lines in the diff).
#
# These checks ARE required. The repository ruleset `main-protection` lists the
# contexts `frontend` and `backend` under required_status_checks with
# strict_required_status_checks_policy, so a red run here blocks the merge —
# even though `make ci` does not run vitest and will happily go green.
# Inspect with: gh api /repos/:owner/:repo/rulesets
#
# ML/Python tests are intentionally omitted — they require a CUDA GPU (mamba/
# Triton initialise at import) that GitHub-hosted runners do not provide. Run
# them in a GPU-enabled one-off container instead.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN in .git/config; no job step pushes/pulls.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: TypeScript (baseline gate)
        run: npm run type-check
      - name: ESLint (0 warnings)
        run: npx eslint --max-warnings=0 src/
      - name: i18n completeness (6 locales)
        run: node scripts/check-i18n.cjs
      - name: Vitest + coverage (enforces threshold)
        run: npx vitest run --coverage --pool=forks --poolOptions.forks.maxForks=2
        env:
          # GitHub-hosted runners have ~7GB RAM; cap heap below that so the
          # instrumented full-suite run doesn't OOM.
          NODE_OPTIONS: --max-old-space-size=5120

  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # backend/essays/module/requirements.txt is NEVER pip-installed: the
      # essays image is `FROM ${ML_IMAGE}` and inherits the ML service's stack
      # verbatim. The file is documentation of what the module expects, so a
      # drift between it and the ML pin is currently cosmetic -- but it stops
      # being cosmetic the moment someone adds a `pip install -r` to
      # docker/essays.Dockerfile, which is an entirely reasonable-looking
      # change to make. This guard is what makes that change safe instead of
      # silently divergent.
      #
      # transformers specifically: the ML pin was verified by loading the real
      # SegFormer and sperm DINOv2 checkpoints and hashing a fixed-input
      # forward. Two different pins would mean the essays worker is documented
      # against a version nobody ran that probe on.
      # A NameError inside a function body is invisible to everything else this
      # repo runs: the module still imports, /health still answers 200, and the
      # failure only surfaces when that branch executes. One shipped on
      # 2026-08-27 -- removing an `import concurrent.futures` while a
      # `concurrent.futures.ALL_COMPLETED` reference remained, on the executor
      # shutdown path. Ruff catches it statically in under a second.
      #
      # Deliberately F821 only. It is the rule with no judgement in it: an
      # undefined name is a runtime crash, never a style opinion, so this gate
      # cannot start arguing with the codebase. Vendored third-party code is
      # excluded because we do not edit it.
      - name: Python undefined names (F821)
        run: |
          pipx install ruff 2>/dev/null || pip install --quiet ruff
          ruff check --isolated --select F821 --no-cache --output-format concise \
            --exclude backend/segmentation/models/microtubule/vendor \
            backend/segmentation backend/essays backend/src

      # A SyntaxError is invisible to every other gate here, and it is NOT
      # hypothetical: on 2026-08-31 PRs #419 and #420 each passed CI, merged
      # without a conflict -- they edit different regions of the same file --
      # and produced `async with` inside a synchronous function. api.main
      # imports that module, so uvicorn could not start at all: /segment and
      # /track went down with /kymograph, on a deploy, in production.
      #
      # Nothing caught it. `python-tests` cannot import api.main on a GPU-less
      # runner (mamba_ssm reaches Triton, which raises "0 active drivers"), and
      # the F821 gate above is measurably blind to it -- `ruff --select F821`
      # reports "All checks passed!" on a file that will not parse. Ruff's E999
      # was removed and cannot be selected, and widening the gate to all of
      # ruff would forfeit exactly the no-judgement property the comment above
      # relies on.
      #
      # compileall keeps that property: a file that does not parse is a crash,
      # never a style opinion. It needs no torch, no GPU and about a second.
      - name: Python files parse
        run: |
          python - <<'EOF'
          import pathlib, sys

          ROOTS = ("backend/segmentation", "backend/essays",
                   "backend/src/services/video/pythonHelpers")
          SKIP = ("backend/segmentation/models/microtubule/vendor",)

          bad = 0
          for root in ROOTS:
              for f in sorted(pathlib.Path(root).rglob("*.py")):
                  if any(str(f).startswith(s) for s in SKIP):
                      continue
                  try:
                      compile(f.read_text(encoding="utf-8"), str(f), "exec")
                  except SyntaxError as e:
                      print(f"{f}:{e.lineno}:{e.offset}: {e.msg}")
                      bad += 1
          print(f"{bad} file(s) failed to parse")
          sys.exit(1 if bad else 0)
          EOF

      # Three requirements files describe ONE stack, and two of them cannot fail
      # a build when they are wrong:
      #
      #   backend/segmentation/requirements.txt   the only one that is built
      #   backend/essays/module/requirements.txt  never pip-installed -- the
      #                                           essays image is `FROM
      #                                           ${ML_IMAGE}` (see the header
      #                                           of docker/essays.Dockerfile)
      #   backend/requirements-pytest-ci.txt      installed by python-tests
      #                                           below, and its own header
      #                                           says fastapi/starlette/
      #                                           pydantic must match the ML
      #                                           image or the essays tests
      #                                           exercise a stack nothing runs
      #
      # REQUIRED is the presence half: the four packages the load-bearing-pins
      # comment at the top of this job argues for by name must appear in BOTH
      # the ml and the essays file, so deleting one is caught and not just
      # disagreeing about one. Everything else is DERIVED -- any package named
      # by two or more of the three files must carry the identical specifier,
      # so a new shared pin is covered without anyone remembering to list it.
      #
      # The derived half is not hypothetical. On 2026-08-31 Dependabot opened
      # #402, bumping opencv-python-headless 4.11.0.86 -> 4.14.0.94 in the
      # ESSAYS file only. A hardcoded four would not have noticed, and nothing
      # else could: that file has no build to fail. It would simply have
      # documented a version that `pip install` cannot resolve at all, since
      # opencv >=4.12 wheels are built against numpy 2.x and numpy is pinned
      # 1.26.4. The same weekly stream hand-syncs pydantic across the ml file
      # and requirements-pytest-ci.txt, which is why the third file is here.
      #
      # Specifiers are compared whole (`>=1.29.0`, not just `==`): the two
      # files carry floors as well as pins, and a floor only one of them has is
      # the same class of silent claim. Lines are parsed with PEP 508 rather
      # than a regex so extras, spacing and env markers cannot make a shared
      # pin silently vanish from the comparison -- an unparseable line is an
      # error here, never a skip.
      - name: ML, essays and CI-test pins agree
        run: |
          pip install --quiet packaging
          python - <<'EOF'
          import re, sys
          from packaging.requirements import Requirement

          FILES = {
              "ml": "backend/segmentation/requirements.txt",
              "essays": "backend/essays/module/requirements.txt",
              "pytest-ci": "backend/requirements-pytest-ci.txt",
          }
          # Must be PRESENT in both of these, not merely in agreement.
          PRESENCE = ("ml", "essays")
          REQUIRED = ("torch", "torchvision", "transformers", "numpy")

          fail = 0

          def canon(name):
              # PEP 503: huggingface_hub and huggingface-hub are one project,
              # and this repo spells some names both ways.
              return re.sub(r"[-_.]+", "-", name).lower()

          def parse(path):
              global fail
              out = {}
              with open(path, encoding="utf-8") as fh:
                  for lineno, raw in enumerate(fh, 1):
                      line = raw.strip()
                      # Blank, whole-line comment, or a pip option (-r, --index-url).
                      if not line or line.startswith("#") or line.startswith("-"):
                          continue
                      # pip requires whitespace before an inline comment.
                      line = re.split(r"\s+#", line, 1)[0].strip()
                      if not line:
                          continue
                      try:
                          req = Requirement(line)
                      except Exception as exc:
                          print("::error file=%s,line=%d::unparseable requirement %r (%s)"
                                % (path, lineno, line, exc))
                          fail = 1
                          continue
                      key = canon(req.name)
                      spec = str(req.specifier)
                      if not spec:
                          # A bare name makes no claim, so it cannot disagree
                          # with one. requirements-pytest-ci.txt leaves the
                          # imaging libraries deliberately unpinned and says so
                          # in its own header; that is a decision, not drift.
                          continue
                      if key in out:
                          # pip refuses a file with two lines for one project
                          # ("Double requirement given"), so this is a broken
                          # file, not a style question. head -1 used to hide it.
                          print("::error file=%s,line=%d::%s named twice (%r then %r)"
                                % (path, lineno, key, out[key][0], spec))
                          fail = 1
                          continue
                      out[key] = (spec, lineno)
              return out

          parsed = {tag: parse(path) for tag, path in FILES.items()}

          for pkg in (canon(p) for p in REQUIRED):
              missing = [t for t in PRESENCE if pkg not in parsed[t]]
              if missing:
                  print("::error::%s pin missing from %s" % (pkg, ", ".join(missing)))
                  fail = 1

          everywhere = sorted(set().union(*(set(p) for p in parsed.values())))
          shared = [p for p in everywhere
                    if sum(1 for t in parsed if p in parsed[t]) > 1]
          if not shared:
              print("::error::no shared requirements found -- the parser is broken")
              fail = 1

          for pkg in shared:
              seen = {t: parsed[t][pkg][0] for t in parsed if pkg in parsed[t]}
              if len(set(seen.values())) > 1:
                  print("::error::%s specifier drift -- %s"
                        % (pkg, "  ".join("%s=%s%s" % (t, pkg, s)
                                          for t, s in sorted(seen.items()))))
                  fail = 1
              else:
                  print("ok  %s%s  [%s]"
                        % (pkg, list(seen.values())[0], ", ".join(sorted(seen))))

          sys.exit(fail)
          EOF

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repository Python. Checkout would otherwise leave
          # GITHUB_TOKEN in .git/config, readable by anything the suites run.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-pytest-ci.txt

      - name: Install
        run: pip install -r backend/requirements-pytest-ci.txt

      # 214 tests that ran nowhere before this job existed. `make ci` covers
      # TypeScript, ESLint and i18n only, so every Python suite in the repo was
      # unguarded -- which is how a NameError on an executor shutdown path and
      # an order-dependent memory assertion both survived to 2026-08-27.
      #
      # The third suite, backend/segmentation/tests, is absent on purpose and
      # not because it is slow: it cannot be COLLECTED without a GPU, since
      # models/__init__ imports mamba_ssm -> Triton, which raises "0 active
      # drivers" at import on a runner with no CUDA. It needs a real card --
      # `make test-ml`. See backend/requirements-pytest-ci.txt for the full
      # reasoning.
      # focus_qc's 132 tests are listed separately because they live inside the
      # vendored package (backend/essays/module/focus_qc/tests) rather than in
      # the module's own tests/ directory, so the path above does not reach
      # them. They are the only thing pinning the focus descriptor's constants
      # and its 1.97x IRM separation margin.
      - name: pytest (video helpers + essays)
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/src/services/video/pythonHelpers/tests \
            backend/essays/tests \
            backend/essays/module/tests \
            backend/essays/module/focus_qc/tests

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN in .git/config; no job step pushes/pulls.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript
        run: npm run type-check
      # backend/src had NO lint gate before this step: the frontend job's
      # `npx eslint src/` is the frontend tree only (the root config ignores
      # `backend/**`), and this job ran TypeScript and Vitest but never ESLint.
      # A hard ESLint error therefore shipped through a fully green PR.
      #
      # It is a baseline gate (scripts/eslint-baseline.mjs against the
      # committed eslint-baseline.json) rather than `--max-warnings=0`, because
      # backend/src still carries pre-existing problems. It fails on anything
      # NOT in the baseline. The script needs no root node_modules — it spawns
      # backend/node_modules/.bin/eslint — so it runs fine in this job, which
      # only installs backend deps; `working-directory` is overridden because
      # the script and its baseline live at the repo root.
      - name: ESLint (baseline gate)
        working-directory: ${{ github.workspace }}
        run: node scripts/eslint-baseline.mjs
      - name: Vitest + coverage (enforces threshold)
        run: npx vitest run --coverage
